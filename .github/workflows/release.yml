name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        shell: bash
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match v'+p.version)"
      - run: npm run verify
      - name: Generated files are current
        shell: bash
        run: git diff --exit-code
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Export native Windows client
        shell: bash
        run: |
          mkdir -p apps/client-godot/build/windows
          godot --headless --path apps/client-godot --export-release "Windows Desktop" "build/windows/Rush & Revenue Online.exe"
      - run: npm run release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
