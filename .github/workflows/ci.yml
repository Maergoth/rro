name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Generated files are current
        shell: bash
        run: git diff --exit-code
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - run: godot --headless --path apps/client-godot --editor --quit
      - name: Capture elevated-isometric runtime QA
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p artifacts/isometric-runtime
          godot --headless --path apps/client-godot --script res://tests/isometric_runtime_capture.gd -- --output-dir="$GITHUB_WORKSPACE/artifacts/isometric-runtime"
          test "$(find artifacts/isometric-runtime -maxdepth 1 -name 'restaurant-*.png' | wc -l)" -eq 4
          test -s artifacts/isometric-runtime/qa.json
      - name: Upload elevated-isometric runtime QA
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: elevated-isometric-runtime-qa
          path: artifacts/isometric-runtime
          if-no-files-found: error
